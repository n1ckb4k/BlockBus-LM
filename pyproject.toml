[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockbus-lm"
version = "0.1.0"
description = "CPU-scale research prototype for composable optional Transformer parameter blocks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/n1ckb4k/BlockBus-LM"
Repository = "https://github.com/n1ckb4k/BlockBus-LM"
Issues = "https://github.com/n1ckb4k/BlockBus-LM/issues"

[tool.setuptools.packages.find]
include = ["modular_llm*"]
